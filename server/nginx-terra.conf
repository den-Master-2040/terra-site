# nginx на домашнем сервере: /etc/nginx/sites-available/terra (ссылка в sites-enabled).
# Сайт — статика из /var/www/terra (ветка deploy), /api/admin/ — админка новостей (server/admin).
# /login открывает login.html благодаря try_files … $uri.html.
server {
    listen 12080 default_server;
    listen [::]:12080 default_server;
    root /var/www/terra;
    index index.html;
    charset utf-8;

    location / { try_files $uri $uri/ $uri.html =404; }
    location ~ /\.git { deny all; }

    location /api/admin/ {
        proxy_pass http://127.0.0.1:12081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;   # фото уходят вместе с новостью
        proxy_read_timeout 120s;    # сохранение — несколько запросов к GitHub
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
